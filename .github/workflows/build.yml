name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify renewal-producer
        working-directory: billing-engine/renewal-producer
        run: ./mvnw -B -ntp verify
      - name: Verify renewal-consumer
        working-directory: payment-service/renewal-consumer
        run: ./mvnw -B -ntp verify

  mock-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mock-bank/requirements*.txt
      - name: Test mock-bank
        working-directory: mock-bank
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q
