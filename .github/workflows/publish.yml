name: publish

# Publishes the five deploy images to GHCR on a manually pushed semver tag
# (vX.Y.Z). Tags are immutable: a tag is published once and never moved, and no
# mutable tag (latest, major-only) is ever created — the platform repo pins exact
# tags in Git. Every image tag is a linux/amd64 + linux/arm64 manifest list; the
# deploy target includes an arm64 node. See docs/architecture.md#deploy-artifacts
# and decision D11.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish payfold-renewal-producer
        uses: docker/build-push-action@v6
        with:
          context: billing-engine/renewal-producer
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/diblan/payfold-renewal-producer:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/diblan/payfold
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=payfold-renewal-producer
          cache-to: type=gha,mode=max,scope=payfold-renewal-producer
      - name: Publish payfold-renewal-consumer
        uses: docker/build-push-action@v6
        with:
          context: payment-service/renewal-consumer
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/diblan/payfold-renewal-consumer:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/diblan/payfold
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=payfold-renewal-consumer
          cache-to: type=gha,mode=max,scope=payfold-renewal-consumer
      - name: Publish payfold-migrations
        uses: docker/build-push-action@v6
        with:
          context: db-migrations
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/diblan/payfold-migrations:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/diblan/payfold
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=payfold-migrations
          cache-to: type=gha,mode=max,scope=payfold-migrations
      - name: Publish payfold-seed-data-gen
        uses: docker/build-push-action@v6
        with:
          context: seed-data-gen
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/diblan/payfold-seed-data-gen:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/diblan/payfold
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=payfold-seed-data-gen
          cache-to: type=gha,mode=max,scope=payfold-seed-data-gen
      - name: Publish payfold-mock-bank
        uses: docker/build-push-action@v6
        with:
          context: mock-bank
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/diblan/payfold-mock-bank:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/diblan/payfold
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=payfold-mock-bank
          cache-to: type=gha,mode=max,scope=payfold-mock-bank
