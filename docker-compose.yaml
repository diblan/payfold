services:
  postgres:
    image: postgres:18
    container_name: pg_payfold
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME:-pg_data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Schema migrations run from the same payfold-migrations image CI publishes
  # (D11/R18): the SQL is baked in at build time and the container is configured
  # via Flyway's native FLYWAY_* env vars — the same contract a Kubernetes Job
  # uses. FLYWAY_CONNECT_RETRIES defaults to 30 inside the image.
  flyway:
    build:
      context: ./db-migrations
    image: payfold-migrations:latest
    container_name: flyway-payfold
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-payfold
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"           # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"    # Management UI http://localhost:15672 (creds from .env)
    volumes:
      # Persist broker data (queues, messages, etc.)
      - ${RABBITMQ_VOLUME:-rmq_data}:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mock SEPA counterparty (D15): accepts SDD collection submissions and reports
  # deterministic outcomes later through the signed settlement webhook spine.
  mock-bank:
    build:
      context: ./mock-bank
    image: payfold-mock-bank:latest
    container_name: mock-bank
    environment:
      BANK_ID: ${BANK_ID:-bank-a}
      BANK_SCHEME: sepa_core
      BANK_WEBHOOK_URL: http://renewal-consumer:8080/webhooks/bank/${BANK_ID:-bank-a}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-payfold-dev-secret}
      BANK_SETTLEMENT_DELAY_SECONDS: ${BANK_SETTLEMENT_DELAY_SECONDS:-2}
      BANK_CHARGEBACK_LAG_SECONDS: ${BANK_CHARGEBACK_LAG_SECONDS:-5}
      BANK_WEBHOOK_RETRY_MAX_ATTEMPTS: ${BANK_WEBHOOK_RETRY_MAX_ATTEMPTS:-8}
      BANK_WEBHOOK_RETRY_BACKOFF_SECONDS: ${BANK_WEBHOOK_RETRY_BACKOFF_SECONDS:-2}
      TZ: ${TZ}
    ports:
      - "${BANK_HTTP_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Same image, different profile — D15's bank N+1 claim, proven; bank-b is
  # deliberately the slow bank.
  mock-bank-b:
    build:
      context: ./mock-bank
    image: payfold-mock-bank:latest
    container_name: mock-bank-b
    environment:
      BANK_ID: bank-b
      BANK_SCHEME: sepa_core
      BANK_WEBHOOK_URL: http://renewal-consumer:8080/webhooks/bank/bank-b
      BANK_WEBHOOK_SECRET: ${BANK_B_WEBHOOK_SECRET:-payfold-dev-secret-b}
      BANK_SETTLEMENT_DELAY_SECONDS: ${BANK_B_SETTLEMENT_DELAY_SECONDS:-8}
      BANK_CHARGEBACK_LAG_SECONDS: ${BANK_B_CHARGEBACK_LAG_SECONDS:-10}
      BANK_WEBHOOK_RETRY_MAX_ATTEMPTS: ${BANK_WEBHOOK_RETRY_MAX_ATTEMPTS:-8}
      BANK_WEBHOOK_RETRY_BACKOFF_SECONDS: ${BANK_WEBHOOK_RETRY_BACKOFF_SECONDS:-2}
      TZ: ${TZ}
    ports:
      - "${BANK_B_HTTP_PORT:-8086}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The same counterparty image in its card scheme — D17.
  mock-card:
    build:
      context: ./mock-bank
    image: payfold-mock-bank:latest
    container_name: mock-card
    environment:
      BANK_ID: cardnet
      BANK_SCHEME: card
      BANK_WORKERS: ${CARDNET_WORKERS:-4}
      BANK_WEBHOOK_URL: http://renewal-consumer:8080/webhooks/bank/cardnet
      BANK_WEBHOOK_SECRET: ${CARDNET_WEBHOOK_SECRET:-payfold-dev-secret-card}
      BANK_SETTLEMENT_DELAY_SECONDS: ${CARDNET_SETTLEMENT_DELAY_SECONDS:-1}
      BANK_CHARGEBACK_LAG_SECONDS: ${CARDNET_CHARGEBACK_LAG_SECONDS:-5}
      BANK_WEBHOOK_RETRY_MAX_ATTEMPTS: ${BANK_WEBHOOK_RETRY_MAX_ATTEMPTS:-8}
      BANK_WEBHOOK_RETRY_BACKOFF_SECONDS: ${BANK_WEBHOOK_RETRY_BACKOFF_SECONDS:-2}
      TZ: ${TZ}
    ports:
      - "${CARDNET_HTTP_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Seed data runs from the same payfold-seed-data-gen image CI publishes
  # (D11/R18): seeder source, JDBC driver, and name data are baked in at build
  # time; entrypoint and working dir come from the image.
  seed-data:
    build:
      context: ./seed-data-gen
    image: payfold-seed-data-gen:latest
    container_name: billing-seed
    environment:
      TZ: ${TZ}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-15000}
      SEED_SDD_PERCENT: ${SEED_SDD_PERCENT:-20}
      SEED_SDD_RULE_PERCENT: ${SEED_SDD_RULE_PERCENT:-4}
      SEED_SDD_SILENT_PERCENT: ${SEED_SDD_SILENT_PERCENT:-2}
      SEED_SDD_RETRY_PERCENT: ${SEED_SDD_RETRY_PERCENT:-2}
      SEED_CARD_RULE_PERCENT: ${SEED_CARD_RULE_PERCENT:-4}
      SEED_CARD_SILENT_PERCENT: ${SEED_CARD_SILENT_PERCENT:-2}
      SEED_CARD_RETRY_PERCENT: ${SEED_CARD_RETRY_PERCENT:-2}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    restart: "no"

  renewal-producer:
    build:
      context: ./billing-engine/renewal-producer
    image: renewal-producer:latest
    container_name: renewal-producer
    environment:
      TZ: ${TZ}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Spring AMQP (Spring Boot autoconfig)
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      # App-specific props (map to rabbitmq.exchange/routingKey, app.timezone/cron)
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTINGKEY: ${RABBITMQ_ROUTINGKEY}
      APP_TIMEZONE: ${TZ}
      APP_SCHEDULECRON: ${APP_SCHEDULECRON}
    ports:
      - "${PRODUCER_HTTP_PORT:-8080}:8080"  # actuator: /actuator/health, /actuator/prometheus, POST /actuator/renewal-job
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      seed-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  renewal-consumer:
    build:
      context: ./payment-service/renewal-consumer
    image: renewal-consumer:latest
    environment:
      TZ: ${TZ}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      # App-specific props (relaxed-binding names for the consumer's application.yaml keys)
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: ${CONSUMER_LISTENER_CONCURRENCY:-1}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_ROUTINGKEY: ${RABBITMQ_ROUTINGKEY}
      BANK_REGISTRY_0_ID: bank-a
      BANK_REGISTRY_0_SCHEME: sepa_core
      BANK_REGISTRY_0_BASE_URL: http://mock-bank:8080
      BANK_REGISTRY_0_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-payfold-dev-secret}
      BANK_REGISTRY_0_COUNTRIES: BE,FR
      BANK_REGISTRY_1_ID: bank-b
      BANK_REGISTRY_1_SCHEME: sepa_core
      BANK_REGISTRY_1_BASE_URL: http://mock-bank-b:8080
      BANK_REGISTRY_1_WEBHOOK_SECRET: ${BANK_B_WEBHOOK_SECRET:-payfold-dev-secret-b}
      BANK_REGISTRY_1_COUNTRIES: NL,IE
      BANK_REGISTRY_2_ID: cardnet
      BANK_REGISTRY_2_SCHEME: card
      BANK_REGISTRY_2_BASE_URL: http://mock-card:8080
      BANK_REGISTRY_2_WEBHOOK_SECRET: ${CARDNET_WEBHOOK_SECRET:-payfold-dev-secret-card}
      RECOVERY_STALE_AFTER_SECONDS: ${RECOVERY_STALE_AFTER_SECONDS:-30}
      RECOVERY_SWEEP_INTERVAL_MS: ${RECOVERY_SWEEP_INTERVAL_MS:-10000}
      DUNNING_RETRIABLE_GRACE_SECONDS: ${DUNNING_RETRIABLE_GRACE_SECONDS:-180}
      DUNNING_HARD_FAIL_GRACE_SECONDS: ${DUNNING_HARD_FAIL_GRACE_SECONDS:-60}
      DUNNING_DISPUTE_GRACE_SECONDS: ${DUNNING_DISPUTE_GRACE_SECONDS:-60}
      DUNNING_RETRY_DELAY_SECONDS: ${DUNNING_RETRY_DELAY_SECONDS:-15}
      DUNNING_SWEEP_INTERVAL_MS: ${DUNNING_SWEEP_INTERVAL_MS:-10000}
      DUNNING_MAX_ATTEMPTS: ${DUNNING_MAX_ATTEMPTS:-3}
    ports:
      - "${CONSUMER_HTTP_PORT:-8081}-${CONSUMER_HTTP_PORT_END:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-bank:
        condition: service_healthy
      mock-bank-b:
        condition: service_healthy
      mock-card:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      seed-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Local observability (R21/D12): industry tooling as code, never a custom UI.
  # Prometheus scrapes both services and the broker's per-queue metrics;
  # Grafana provisions its datasource and the pipeline dashboard from files at
  # boot — a fresh `docker compose up` serves the dashboard with zero clicks.
  # The platform repo runs its own in-cluster stack; these two are the
  # compose-local demo equivalent.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-payfold
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana-payfold
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-payfold}
      # Anonymous read access: the demo dashboard must render without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg_data:
  rmq_data:
