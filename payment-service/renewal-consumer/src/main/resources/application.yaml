spring:
  application:
    name: renewal-consumer
  datasource:
    url: jdbc:postgresql://localhost:5432/yourdb
    username: youruser
    password: yourpassword
  jackson:
    time-zone: Europe/Brussels
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s

rabbitmq:
  exchange: billing.renewals
  queue: billing.renewals.main
  routingKey: renewal.requested

bank:
  # Polices hung counterparties only: the listener retry envelope owns the
  # DLQ deadline (G5), and a saturated-but-alive counterparty must produce
  # slow submits -- blocked listener threads are the backpressure -- never
  # poison verdicts (D19).
  timeout-ms: 10000
  registry:
    - id: bank-a
      scheme: sepa_core
      base-url: http://localhost:8085
      webhook-secret: payfold-dev-secret
      countries: BE,FR
    - id: bank-b
      scheme: sepa_core
      base-url: http://localhost:8086
      webhook-secret: payfold-dev-secret-b
      countries: NL,IE
    - id: cardnet
      scheme: card
      base-url: http://localhost:8087
      webhook-secret: payfold-dev-secret-card

recovery:
  # Application default exceeds the worst-case delivery envelope + settlement
  # delay + chargeback lag (D18), so a merely-slow webhook is never swept in a
  # real deployment; the compose stack overrides to seconds for verify/demo.
  stale-after-seconds: 300
  sweep-interval-ms: 60000

dunning:
  # Every terminal reason maps to exactly one dunning class (D16/R26 spine);
  # the map is policy and is deliberately yaml-fixed — only the grace windows
  # are env-tunable (scaled time, fast for verify, visible for demo).
  classes:
    AM04: retriable
    insufficient_funds: retriable
    AC04: hard_fail
    MD01: hard_fail
    do_not_honor: hard_fail
    MD06: dispute
    fraud_dispute: dispute
  retriable-grace-seconds: 604800
  hard-fail-grace-seconds: 259200
  dispute-grace-seconds: 1209600
  # Re-collection cadence (D20): delay anchors on the failed attempt's
  # completed_at; the sweep interval mirrors the recovery sweeper's pair.
  # Compose scales both down for verify/demo.
  retry-delay-seconds: 86400
  sweep-interval-ms: 60000
  # Bounded exhaustion (R26c/D21): total attempts (base + re-collections) stop
  # at max-attempts; the sweeper then cancels the subscription. Grace expiry
  # is the class-blind backstop for every class.
  max-attempts: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
