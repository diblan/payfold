spring:
  application:
    name: renewal-consumer
  datasource:
    url: jdbc:postgresql://localhost:5432/yourdb
    username: youruser
    password: yourpassword
  jackson:
    time-zone: Europe/Brussels
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2.0
          max-interval: 10s

rabbitmq:
  exchange: billing.renewals
  queue: billing.renewals.main
  routingKey: renewal.requested

bank:
  timeout-ms: 2000
  registry:
    - id: bank-a
      scheme: sepa_core
      base-url: http://localhost:8085
      webhook-secret: payfold-dev-secret
      countries: BE,FR
    - id: bank-b
      scheme: sepa_core
      base-url: http://localhost:8086
      webhook-secret: payfold-dev-secret-b
      countries: NL,IE
    - id: cardnet
      scheme: card
      base-url: http://localhost:8087
      webhook-secret: payfold-dev-secret-card

recovery:
  # Application default exceeds the worst-case delivery envelope + settlement
  # delay + chargeback lag (D18), so a merely-slow webhook is never swept in a
  # real deployment; the compose stack overrides to seconds for verify/demo.
  stale-after-seconds: 300
  sweep-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
